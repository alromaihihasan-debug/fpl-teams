name: FPL team sync
on:
  schedule:
    - cron: "0 6,18 * * *"      # scheduled refresh of all registered teams
  workflow_dispatch:             # manual or remote trigger, any team ID
    inputs:
      team_id:
        description: "FPL team ID to fetch (blank = refresh all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_teams.py
        env:
          TEAM_ID: ${{ github.event.inputs.team_id }}
      - run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git pull --rebase || true
          git add -A
          git diff --quiet --cached || git commit -m "sync $(date -u +%F_%H%M)"
          git push
